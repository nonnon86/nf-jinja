<h1>京大神社</h1>
<p>吉田の地に現れる、四日間だけの社。</p>
<button onclick="drawOmikuji()">おみくじを引く</button>
<p id="result"></p>
<script>
    function drawOmikuji(){
        const fortunes = ["大吉", "中吉", "小吉", "吉", "末吉", "凶"];

        const randomNumber = Math.floor(Math.random() * fortunes.length);

        document.getElementById("result").textContent = fortunes[randomNumber];
    }
</script>
